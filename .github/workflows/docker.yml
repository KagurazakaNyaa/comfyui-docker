name: Build Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtimes: [ "cpu", "rocm", "cu130", "cu132", "cu126", "therock" ]

    steps:
      - name: Free Disk Space (Ubuntu)
        id: cleanup
        uses: justinthelaw/maximize-github-runner-space@v0.12.4
        with:
          cleanup-profile: custom
          remove-android: "true"
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Verify disk cleanup
        env:
          FAILED_OPERATIONS: ${{ steps.cleanup.outputs.failed-operations }}
        run: |
          test "$FAILED_OPERATIONS" = "0"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: kagurazakanyaa/comfyui,ghcr.io/kagurazakanyaa/comfyui
          flavor: |
            latest=auto
            prefix=${{ matrix.runtimes }}-,onlatest=true

      - name: Docker CUDA meta
        id: cuda_meta
        if: matrix.runtimes == 'cu132'
        uses: docker/metadata-action@v6
        with:
          images: kagurazakanyaa/comfyui,ghcr.io/kagurazakanyaa/comfyui
          flavor: |
            latest=auto
            prefix=cuda-,onlatest=true

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          file: ${{ matrix.runtimes }}.dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.cuda_meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
